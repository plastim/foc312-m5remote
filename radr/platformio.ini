; The remote on the RADR hardware (R+D's wireless remote, v0.4: ESP32-S3-WROOM-1-N16R8, a 2.0" ST7789, two knobs,
; two shoulder buttons, three buttons under the screen, a vibration motor, a buzzer, three WS2812B, a MAX17048 fuel
; gauge, a CP2102 USB-UART with auto-reset). Patterns only. The app is ../app, shared with the M5 (../m5); this
; project is the RADR's board layer (src/). Our firmware, written from scratch: pins and parts are facts from R+D's
; published schematic (CERN-OHL-S-2.0 hardware); no code of theirs (README "The RADR hardware").
; Build: set PLATFORMIO_CORE_DIR=$HOME/tools/platformio-core (or use PlatformIO's default), then
;   pio run -e radr                                    the image (tools/package_m5.py --board radr makes the release)
;   pio run -e radr -t upload --upload-port COMx       through the CP2102's auto-reset (no BOOT button needed)
; Back up the RADR's own firmware before the first flash (README "The RADR hardware": esptool read-flash).
; Patterns and settings go on with: py -3.13 -m stimengine.remote load --port COMx (921600 baud, DTR/RTS low)

[platformio]
default_envs = radr

[env:radr]
platform = espressif32@6.5.0
board = esp32s3_n16r8_cp2102
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    madhephaestus/ESP32Encoder@0.11.7
    bblanchon/ArduinoJson@7.2.1
    symlink://../core
    symlink://../app
; Serial is UART0 (GPIO 43 / 44, the CP2102): the loader protocol, no framework log lines on it
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_RADR=1
