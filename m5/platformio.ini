; The M5 remote's firmware (notes/m5-remote.md): M5Stack CoreS3 SE on the OSSM M5 Remote carrier (4 encoders, 2 with
; push, 1 MX button). Build: set PLATFORMIO_CORE_DIR=$HOME/tools/platformio-core, then
;   pio run -e app -t upload --upload-port COMx        the remote (all logic is core/, tested on the host by foc312-engine)
;   pio run -e hwtest -t upload --upload-port COMx     hardware bring-up: every knob count and button level
; Flash only with PlaStim's go; the OSSM firmware's backup is private/m5/ossm-remote-backup-16MB.bin.
; Patterns and settings go on with: py -3.13 -m stimengine.remote load --port COMx

[platformio]
default_envs = app

[env]
platform = espressif32@6.5.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
lib_deps =
    m5stack/M5Unified@0.1.16
    madhephaestus/ESP32Encoder@0.11.7
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:hwtest]
build_src_filter = +<hwtest/>

[env:app]
build_src_filter = +<app/>
; the USB serial carries the loader protocol: no framework log lines on it
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@7.2.1
    symlink://../core
